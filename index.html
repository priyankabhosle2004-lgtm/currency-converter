
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Convert currencies easily with live exchange rates.">

  <title>Currency Converter</title>

  <!-- CSS file -->
  <link rel="stylesheet" href="style.css">

  <!-- JavaScript file -->
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="logo">💱</div>
      <p class="eyebrow">SMART MONEY TOOLS</p>
      <h1>Currency <span>Converter</span></h1>
      <p class="subtitle">
        Convert currencies with live exchange rates.
      </p>
    </header>

    <form id="converter-form">

      <div class="input-group">
        <label for="amount">Amount</label>
        <input
          type="number"
          id="amount"
          min="0"
          step="any"
          value="1"
          placeholder="Enter amount"
          required
        >
      </div>

      <div class="currency-row">

        <div class="input-group currency-field">
          <label for="from-currency">From</label>
          <select id="from-currency">
            <option value="USD" selected>🇺🇸 USD</option>
            <option value="INR">🇮🇳 INR</option>
            <option value="EUR">🇪🇺 EUR</option>
            <option value="GBP">🇬🇧 GBP</option>
            <option value="JPY">🇯🇵 JPY</option>
            <option value="CAD">🇨🇦 CAD</option>
            <option value="AUD">🇦🇺 AUD</option>
            <option value="CHF">🇨🇭 CHF</option>
            <option value="CNY">🇨🇳 CNY</option>
            <option value="AED">🇦🇪 AED</option>
          </select>
        </div>

        <button
          type="button"
          id="swap-btn"
          class="swap-btn"
          aria-label="Swap currencies"
          title="Swap currencies"
        >⇄</button>

        <div class="input-group currency-field">
          <label for="to-currency">To</label>
          <select id="to-currency">
            <option value="USD">🇺🇸 USD</option>
            <option value="INR" selected>🇮🇳 INR</option>
            <option value="EUR">🇪🇺 EUR</option>
            <option value="GBP">🇬🇧 GBP</option>
            <option value="JPY">🇯🇵 JPY</option>
            <option value="CAD">🇨🇦 CAD</option>
            <option value="AUD">🇦🇺 AUD</option>
            <option value="CHF">🇨🇭 CHF</option>
            <option value="CNY">🇨🇳 CNY</option>
            <option value="AED">🇦🇪 AED</option>
          </select>
        </div>

      </div>

      <button type="submit" id="convert-btn" class="convert-btn">
        <span>Convert Currency</span>
        <span aria-hidden="true">→</span>
      </button>

    </form>

    <section class="result" aria-live="polite">
      <p class="result-label">CONVERTED AMOUNT</p>
      <h2 id="result">--</h2>
      <p id="exchange-rate">Enter an amount to get started.</p>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <footer class="footer">
      <span class="live-dot"></span>
      Exchange rates by Frankfurter API
    </footer>

  </main>
</body>
</html>
